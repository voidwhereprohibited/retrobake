name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.17"
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . "pip-audit>=2.10"
      - run: pip-audit --skip-editable

  # Filled in at M1/M6 by nes-engine, snes-engine, qa and release.
  bake-and-boot:
    name: Bake sample ROMs + emulator smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run qa smoke test if present
        shell: bash
        run: |
          if [ -f tests/emulator/run_smoke.py ]; then
            python3 tests/emulator/run_smoke.py
          else
            echo "No emulator smoke test yet (qa task #9). Skipping."
          fi

  package:
    name: Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build package if packaging scripts exist
        shell: bash
        run: |
          if [ -f packaging/build.py ]; then
            python3 packaging/build.py
          else
            echo "Packaging lands in M6 (PyInstaller + Inno Setup / AppImage). Skipping."
          fi
