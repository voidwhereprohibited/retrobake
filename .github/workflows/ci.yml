name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.17"
      - name: Check Actions are pinned to commit SHAs
        run: python tools/check_action_pins.py
      - run: ruff check src tests
      - run: ruff format --check src tests

  cc65:
    name: Build bundled cc65 (ca65 + ld65)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pin
        run: echo "commit=$(grep -oP 'CC65_COMMIT="\K[0-9a-f]+' tools/build_cc65.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: toolchains/cc65
          key: cc65-${{ steps.pin.outputs.commit }}-${{ hashFiles('tools/build_cc65.sh') }}
      - name: Build ca65/ld65 for Linux and Windows
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64
          bash tools/build_cc65.sh toolchains/cc65
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cc65-toolchain
          path: toolchains/cc65
          retention-days: 7

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    needs: cc65
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cc65-toolchain
          path: toolchains/cc65
      - name: Point tests at the bundled cc65
        shell: bash
        run: |
          plat=linux; [ "$RUNNER_OS" = Windows ] && plat=windows
          chmod +x toolchains/cc65/$plat/bin/* || true
          echo "RETROBAKE_CC65_DIR=$GITHUB_WORKSPACE/toolchains/cc65/$plat/bin" >> "$GITHUB_ENV"
          echo "RETROBAKE_REQUIRE_CC65=1" >> "$GITHUB_ENV"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e . "pip-audit>=2.10"
      - run: pip-audit --skip-editable

  # Filled in at M1/M6 by nes-engine, snes-engine, qa and release.
  bake-and-boot:
    name: Bake sample ROMs + emulator smoke test
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # qa: boots self-test ROMs (+ baked ROMs in RETROBAKE_SMOKE_ROMS once engines land)
      # on the libretro cores players use: Mesen + FCEUmm (NES), Snes9x (SNES).
      - name: Headless emulator boot test
        run: python tests/emulator/run_smoke.py --fetch-cores
      - name: Upload boot report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-report-${{ matrix.os }}
          path: tests/emulator/out/smoke-report.json
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build package if packaging scripts exist
        shell: bash
        run: |
          if [ -f packaging/build.py ]; then
            python3 packaging/build.py
          else
            echo "Packaging lands in M6 (PyInstaller + Inno Setup / AppImage). Skipping."
          fi

  # snes-engine: bundled SNES toolchain (wla-65816 + wlalink at PVSnesLib 4.6.0's pin).
  snes-toolchain:
    name: Build bundled SNES toolchain (wla-dx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pin
        run: echo "commit=$(grep -oP 'WLA_COMMIT="\K[0-9a-f]+' tools/build_snes_toolchain.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: toolchains/pvsneslib
          key: wladx-${{ steps.pin.outputs.commit }}-${{ hashFiles('tools/build_snes_toolchain.sh') }}
      - name: Build wla-65816/wlalink for Linux and Windows
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 cmake
          bash tools/build_snes_toolchain.sh toolchains/pvsneslib
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snes-toolchain
          path: toolchains/pvsneslib
          retention-days: 7

  snes-bake:
    name: SNES bake + Snes9x boot (${{ matrix.os }})
    needs: snes-toolchain
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snes-toolchain
          path: toolchains/pvsneslib
      - name: Point tests at the bundled SNES toolchain
        shell: bash
        run: |
          plat=linux; [ "$RUNNER_OS" = Windows ] && plat=windows
          chmod +x toolchains/pvsneslib/$plat/bin/* || true
          echo "RETROBAKE_WLA_DIR=$GITHUB_WORKSPACE/toolchains/pvsneslib/$plat/bin" >> "$GITHUB_ENV"
          echo "RETROBAKE_REQUIRE_WLA=1" >> "$GITHUB_ENV"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/builders/test_snes.py -v
      - run: python tools/bake_sample_snes.py baked/sample-hello.sfc
      - name: Get qa's emulator smoke test (from agent/qa until it is merged)
        shell: bash
        run: |
          if [ ! -f tests/emulator/run_smoke.py ]; then
            git fetch -q --depth 1 https://github.com/${{ github.repository }}.git agent/qa
            git checkout FETCH_HEAD -- tests/emulator
          fi
      - name: Boot baked SNES ROM on Snes9x (signature, Start -> gameplay)
        run: python tests/emulator/run_smoke.py --fetch-cores --roms baked --report baked/smoke-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sample-snes-rom-${{ matrix.os }}
          path: baked/
          retention-days: 14

  # nes-engine: bake the sample NES ROM with the bundled cc65 and boot it on Mesen + FCEUmm.
  nes-bake:
    name: NES bake + Mesen/FCEUmm boot (${{ matrix.os }})
    needs: cc65
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cc65-toolchain
          path: toolchains/cc65
      - name: Point tests at the bundled cc65
        shell: bash
        run: |
          plat=linux; [ "$RUNNER_OS" = Windows ] && plat=windows
          chmod +x toolchains/cc65/$plat/bin/* || true
          echo "RETROBAKE_CC65_DIR=$GITHUB_WORKSPACE/toolchains/cc65/$plat/bin" >> "$GITHUB_ENV"
          echo "RETROBAKE_REQUIRE_CC65=1" >> "$GITHUB_ENV"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/builders/test_nes.py -v
      - run: python tools/bake_sample_nes.py baked/sample-hello.nes
      - name: Boot baked NES ROM on Mesen + FCEUmm (signature, Start -> gameplay)
        run: python tests/emulator/run_smoke.py --fetch-cores --roms baked --report baked/smoke-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sample-nes-rom-${{ matrix.os }}
          path: baked/
          retention-days: 14
