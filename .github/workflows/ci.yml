name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.17"
      - run: ruff check src tests
      - run: ruff format --check src tests

  cc65:
    name: Build bundled cc65 (ca65 + ld65)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pin
        run: echo "commit=$(grep -oP 'CC65_COMMIT="\K[0-9a-f]+' tools/build_cc65.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: cache
        with:
          path: toolchains/cc65
          key: cc65-${{ steps.pin.outputs.commit }}-${{ hashFiles('tools/build_cc65.sh') }}
      - name: Build ca65/ld65 for Linux and Windows
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64
          bash tools/build_cc65.sh toolchains/cc65
      - uses: actions/upload-artifact@v7
        with:
          name: cc65-toolchain
          path: toolchains/cc65
          retention-days: 7

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    needs: cc65
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - uses: actions/download-artifact@v8
        with:
          name: cc65-toolchain
          path: toolchains/cc65
      - name: Point tests at the bundled cc65
        shell: bash
        run: |
          plat=linux; [ "$RUNNER_OS" = Windows ] && plat=windows
          chmod +x toolchains/cc65/$plat/bin/* || true
          echo "RETROBAKE_CC65_DIR=$GITHUB_WORKSPACE/toolchains/cc65/$plat/bin" >> "$GITHUB_ENV"
          echo "RETROBAKE_REQUIRE_CC65=1" >> "$GITHUB_ENV"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Bake sample NES ROM for qa
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python tools/bake_sample_nes.py sample-hello.nes
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux' && matrix.python == '3.12'
        with:
          name: sample-nes-rom
          path: sample-hello.nes
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . "pip-audit>=2.10"
      - run: pip-audit --skip-editable

  # Filled in at M1/M6 by nes-engine, snes-engine, qa and release.
  bake-and-boot:
    name: Bake sample ROMs + emulator smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run qa smoke test if present
        shell: bash
        run: |
          if [ -f tests/emulator/run_smoke.py ]; then
            python3 tests/emulator/run_smoke.py
          else
            echo "No emulator smoke test yet (qa task #9). Skipping."
          fi

  package:
    name: Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build package if packaging scripts exist
        shell: bash
        run: |
          if [ -f packaging/build.py ]; then
            python3 packaging/build.py
          else
            echo "Packaging lands in M6 (PyInstaller + Inno Setup / AppImage). Skipping."
          fi
