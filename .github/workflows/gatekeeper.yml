name: Gatekeeper
# Runs on every push/PR. All actions pinned to full commit SHAs; token is read-only.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly re-scan for newly published CVEs

permissions: {}           # default: nothing. Each job asks only for what it needs.

concurrency:
  group: gatekeeper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # full history so gitleaks scans old commits too
          persist-credentials: false  # don't leave the token on disk
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned scanners
        run: python -m pip install --no-cache-dir "ruff==0.17.3" "bandit==1.9.4" "zizmor==1.32.0" "lizard==1.25.0" "pre-commit==4.7.0"
      - name: Run all pre-commit hooks (except local AI review)
        env:
          SKIP: ai-review
        run: pre-commit run --all-files --show-diff-on-failure --hook-stage pre-push
      - name: Workflow audit (zizmor)
        run: zizmor --min-severity medium .github/workflows

  deps:
    # Google's reusable OSV workflow: checks requirements*.txt, package-lock, etc. against osv.dev
    permissions:
      contents: read
      actions: read
      security-events: write   # to upload results to the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0

  codeql:
    # Free on public repos. Alternative: turn on "CodeQL default setup" in Settings and delete this job.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: python, actions
          queries: security-and-quality
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
