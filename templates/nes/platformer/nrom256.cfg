# ld65 config for the RetroBake NES platformer: NROM-256 (32 KB PRG at $8000, 8 KB CHR).
# $8000-$CFFF: level data written by the builder (levels.bin). $D000-$FFFF: engine code.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    # $07FC-$07FF is reserved for the qa boot signature.
    RAM:    start = $0480, size = $037C, type = rw, file = "";
    HDR:    start = $0000, size = $0010, type = ro, file = %O, fill = yes, fillval = $00;
    PRG:    start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss, optional = yes;
    HEADER:   load = HDR, type = ro;
    LEVELS:   load = PRG, type = ro,  start = $8000;
    CODE:     load = PRG, type = ro,  start = $D000;
    RODATA:   load = PRG, type = ro;
    VECTORS:  load = PRG, type = ro,  start = $FFFA;
    CHARS:    load = CHR, type = ro;
}
