# ld65 config for RetroBake's NES platformer engine: NROM-256 (32 KB PRG at $8000, 8 KB CHR).
# Original RetroBake file.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    # $0100-$01BF hardware stack, $01C0-$01DF neslib palette buffer, $0200-$02FF sprite buffer.
    # $0600-$06FF is reserved for neslib's software argument stack, $07FC-$07FF for the qa
    # boot signature.
    RAM:    start = $0300, size = $0300, type = rw, file = "";
    HDR:    start = $0000, size = $0010, type = ro, file = %O, fill = yes, fillval = $00;
    PRG:    start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss;
    HEADER:   load = HDR, type = ro;
    CODE:     load = PRG, type = ro,  start = $8000;
    RODATA:   load = PRG, type = ro;
    VECTORS:  load = PRG, type = ro,  start = $FFFA;
    CHARS:    load = CHR, type = ro;
}
