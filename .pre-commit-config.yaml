# Hooks run locally (pre-commit + pre-push) and in .github/workflows/gatekeeper.yml.
# Every remote repo is pinned to a full commit SHA; the tag is in the comment.
default_install_hook_types: [pre-commit, pre-push]
# Both stages: pre-commit gives fast feedback per commit, and pre-push is the stage
# Gatekeeper runs (--hook-stage pre-push), so local pushes see exactly what CI sees.
default_stages: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # v0.17.3 (matches gatekeeper.yml)
    hooks:
      - id: ruff-check
        files: ^(src|tests)/
      # Same scope as CI's `ruff format --check src tests`; tools/ is not ruff-formatted yet.
      - id: ruff-format
        files: ^(src|tests)/
  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # 1.9.4 (matches gatekeeper.yml)
    hooks:
      - id: bandit
        args: [--severity-level, medium, --confidence-level, medium]
        files: ^src/
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
